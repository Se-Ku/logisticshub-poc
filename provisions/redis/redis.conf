# Allow external connections inside the container network
bind 0.0.0.0

# Disable the default root user for security (optional for dev, recommended for production)
user default off

# Create a dedicated worker user
# Format: user <username> <on/off> ><password> ~<key_pattern> +@<command_category>
user node_worker on >WorkerSecretPass123! ~* +@read +@write +@string +@connection +info

